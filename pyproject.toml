[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontierguard"
version = "0.3.1"
description = "First-error-frontier attribution and mixed-precision quantization for reasoning language models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "FrontierGuard contributors"}]
dependencies = [
  "numpy>=1.26",
  "packaging>=23",
  "PyYAML>=6.0",
  "torch>=2.3",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
research = [
  "accelerate>=0.32",
  "datasets>=2.17",
  "safetensors>=0.4",
  "tqdm>=4.66",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
frontierguard = "frontierguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
