quant:
  backend: smoothquant_reference_fake
  backend_selector: smoothquant
  fake_quant: true
  packed_kernel: false
  role: calibrated_reference_not_formal_sota
  calibration:
    method: per_linear_channel_absmax
    alpha: 0.5
    samples: 32
    max_seq_tokens: 2048
    artifact: artifacts/calibration/smoothquant_scales.safetensors
  default:
    weight_bits: 4
    activation_bits: 4
    kv_bits: 4
    weight_group_size: 128
    kv_group_size: 128
    symmetric_weight: true
    symmetric_activation: true
    symmetric_kv: false
  warning: FlatQuant or QuaRot is required as the formal strong W4A4 baseline.
