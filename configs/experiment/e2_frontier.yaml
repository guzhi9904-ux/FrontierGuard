includes:
  - ../model/ds_r1_qwen_1_5b.yaml
  - ../quant/uq_w4a4kv4.yaml
  - ../data/numinamath_profile.yaml
experiment:
  name: e2_frontier
  split: profile
  teacher_forcing:
    candidate_steps: 5
    exhaustive_step_threshold: 16
    candidate_neighbor_radius: 1
    step_quantile: 0.95
  counterfactual:
    seeds: [0, 1, 2, 3]
    bootstrap_samples: 5000
    confidence_level: 0.95
    min_trustworthy_seeds: 4
  detector:
    jsd_weight: 0.25
    margin_weight: 0.25
    bypass_weight: 0.50
    combined_threshold: 0.5
    bypass_threshold: 0.0
    require_persistence: true
