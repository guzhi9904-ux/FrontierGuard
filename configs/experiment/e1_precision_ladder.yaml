experiment:
  name: e1_precision_ladder
  purpose: separate implementation errors, weight damage, and activation damage
  split: smoke
  conditions:
    - {name: bf16_identity, weight_bits: 16, activation_bits: 16, kv_bits: 16}
    - {name: w4a16, weight_bits: 4, activation_bits: 16, kv_bits: 16}
    - {name: w16a4, weight_bits: 16, activation_bits: 4, kv_bits: 16}
    - {name: w8a8, weight_bits: 8, activation_bits: 8, kv_bits: 16}
    - {name: w4a8, weight_bits: 4, activation_bits: 8, kv_bits: 16}
    - {name: w4a4, weight_bits: 4, activation_bits: 4, kv_bits: 16}
  diagnostics:
    jsd_saturation_threshold: 0.68
    identity_absolute_tolerance: 1.0e-6
    prohibit_counterfactual_when_all_steps_saturate: true
